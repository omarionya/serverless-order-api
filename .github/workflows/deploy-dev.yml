name: Deploy dev
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the generated plan (false means plan only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: order-api-dev-terraform
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TFVARS_JSON: ${{ secrets.DEV_TFVARS_JSON }}
      TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Check settings and write dev inputs
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          required = {
              "TERRAFORM_VERSION": "repository variable TERRAFORM_VERSION",
              "AWS_REGION": "dev environment variable AWS_REGION",
              "STATE_BUCKET": "dev environment variable TF_STATE_BUCKET",
              "STATE_KEY": "dev environment variable TF_STATE_KEY",
              "TFVARS_JSON": "dev environment secret DEV_TFVARS_JSON",
          }

          missing = [
              setting
              for name, setting in required.items()
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              for setting in missing:
                  print(f"::error::Missing {setting}")
              raise SystemExit(1)

          try:
              data = json.loads(os.environ["TFVARS_JSON"])
          except json.JSONDecodeError as error:
              print(
                  "::error::DEV_TFVARS_JSON contains invalid JSON "
                  f"at line {error.lineno}, column {error.colno}"
              )
              raise SystemExit(1)

          if not isinstance(data, dict):
              print("::error::DEV_TFVARS_JSON must be a JSON object")
              raise SystemExit(1)

          target = Path("environments/dev/ci.auto.tfvars.json")
          target.write_text(json.dumps(data))
          target.chmod(0o600)
          print("Required settings checked and Terraform inputs written.")
          PYTHON
      - name: Checks before AWS authentication
        run: bash scripts/ci_checks.sh

      - name: Inspect OIDC identity
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={
                  "Authorization": (
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:", claims["sub"])
          print("OIDC audience:", claims["aud"])
          PYTHON

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}
      - name: Initialize existing dev state
        run: |
          terraform -chdir=environments/dev init -reconfigure -input=false -lockfile=readonly             -backend-config="bucket=$STATE_BUCKET"             -backend-config="key=$STATE_KEY"             -backend-config="region=$AWS_REGION"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform -chdir=environments/dev plan -input=false -lock-timeout=5m -out=dev.tfplan
      - name: Apply this run's plan
        if: inputs.apply
        run: terraform -chdir=environments/dev apply -input=false -lock-timeout=5m dev.tfplan
      - name: Remove temporary inputs and plan
        if: always()
        run: rm -f environments/dev/ci.auto.tfvars.json environments/dev/dev.tfplan
